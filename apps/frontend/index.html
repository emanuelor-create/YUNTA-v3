<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yunta</title>
    <!-- Paleta y modo guardados (lib/palette.ts, lib/theme.ts), antes del bundle para que no parpadeen. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('yunta.palette');
          if (p === 'azul') document.documentElement.dataset.palette = p;
          if (localStorage.getItem('yunta.theme') === 'dark') document.documentElement.dataset.theme = 'dark';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
