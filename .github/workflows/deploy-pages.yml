# Publica el frontend en GitHub Pages: https://<usuario>.github.io/<repo>/
# Compila la app y deja el resultado (con su index.html) en la rama gh-pages.
# En Settings → Pages: Source "Deploy from a branch", Branch "gh-pages" / (root).
# El backend NO va acá (Pages es solo estático): ver DEPLOY.md (Railway).
name: Deploy frontend a GitHub Pages

on:
  push:
    branches: [main, feat/yunta-v3-app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar frontend
        run: npm run build:frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Settings → Secrets and variables → Actions → pestaña "Variables"
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # Pages no tiene rewrites: con 404.html = index.html, recargar
      # /projects/... sigue cargando la app en vez de dar error.
      # .nojekyll: que Pages sirva los archivos tal cual, sin procesarlos.
      - name: Preparar sitio
        run: |
          cp apps/frontend/dist/index.html apps/frontend/dist/404.html
          touch apps/frontend/dist/.nojekyll

      - name: Publicar en la rama gh-pages
        working-directory: apps/frontend/dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
